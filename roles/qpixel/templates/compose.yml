services:
  qpixel:
    build:
      context: "{{app_root}}/qpixel"
      dockerfile: "{{app_root}}/qpixel/docker/Dockerfile"  # relative to docker context
    # user: "{{uid}}:{{gid}}"  # run the container service as app user (not root)
    environment:
      COMMUNITY_NAME: "{{qpixel_community_name}}"
      COMMUNITY_HOST: "{{app_domain}}"
      LANG: cs_CZ.UTF-8
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: true
      CONFIRMABLE_ALLOWED_ACCESS_DAYS: 2
      COMMUNITY_ADMIN_USERNAME: admin
      COMMUNITY_ADMIN_PASSWORD: "{{admin_password}}"
      COMMUNITY_ADMIN_EMAIL: admin@{{domain}}
      COMMUNITY_OTHERS_SHOW: "false"
      SMTP_HOST: mail.{{domain}}
      SMTP_PORT: "{{smtp_port}}"
      SMTP_DOMAIN: "{{app_domain}}"
      SMTP_USER_NAME: "{{admin_user}}"
      SMTP_PASSWORD: "{{admin_password}}"
      SECRET_KEY_BASE: "{{(lokal_secret + 'qpixel') | hash('sha1') | regex_search('\\w{24}') }}"
    volumes:  # use only bind-mounts inside {{app_root}} folder as shown below
    - {{app_root}}/config/database.yml:/code/config/database.yml
    - {{app_root}}/config/storage.yml:/code/config/storage.yml
    - {{app_root}}/log:/code/log
    - {{app_root}}/.irbrc:/code/.irbrc
{% if qpixel_logo is defined %}
    - {{app_root}}/assets/logo.png:/code/public/assets/logo.png
    - {{app_root}}/assets/logo.png:/code/public/assets/logo-writing.png
    - {{app_root}}/assets/logo.png:/code/public/assets/codidact.png
    - {{app_root}}/assets/logo.png:/code/public/assets/codidactyl.png
    - {{app_root}}/assets/logo.png:/code/public/assets/codidact-org.png
    - {{app_root}}/assets/logo.png:/code/public/assets/favicon.png
{% endif %}
{% if qpixel_icon is defined %}
    - {{app_root}}/assets/favicon.ico:/code/public/favicon.ico
    - {{app_root}}/assets/favicon.ico:/code/public/assets/square.ico
    - {{app_root}}/assets/favicon.ico:/code/public/assets/fbm.ico
{% endif %}
    restart: unless-stopped
    depends_on:
    - redis
    networks:
    - traefik # necessary for extenal access to your app (via a domain name)
    - mysql # necessary if you want to use the external mysql database
    - prometheus
    - qpixel
{% include "labels.yml" %}

  redis:
    image: redis:alpine
    hostname: redis
    restart: unless-stopped
    networks:
      - qpixel

networks:
  traefik:
    external: true
  mysql:
    external: true
  prometheus:
    external: true
  qpixel:
    driver: bridge



